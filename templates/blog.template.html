<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Mushroom Agency — Blog</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/blog-styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="/index.html" class="logo">The Mushroom Agency</a>
    <nav>
      <a href="/index.html">Home</a>
      <a class="active" href="/blog.html">Blog</a>
    </nav>
  </header>

  <main class="blog-container">
    <section class="featured-section">
      <h2>Featured</h2>
      <div class="featured-grid">
        {{FEATURED}}
      </div>
    </section>

    <div class="blog-controls">
      <div class="categories">
        <button class="category-btn active" data-category="all">All</button>
        <button class="category-btn" data-category="ai">AI</button>
        <button class="category-btn" data-category="automation">Automation</button>
        <button class="category-btn" data-category="business">Business</button>
        <button class="category-btn" data-category="news">News</button>
      </div>
      <div class="search">
        <input type="text" id="search-input" placeholder="Search posts..." />
      </div>
    </div>

    <section class="posts-section">
      <div class="posts-grid">
        {{CARDS}}
      </div>
    </section>
  </main>

  <script src="/blog-script.js"></script>
</body>
</html>
