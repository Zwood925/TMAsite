<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — The Mushroom Agency</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/blog-styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="/index.html" class="logo">The Mushroom Agency</a>
    <nav>
      <a href="/index.html">Home</a>
      <a class="active" href="/blog.html">Blog</a>
    </nav>
  </header>

  <article class="post">
    <div class="post-hero">
      <img src="{{COVER_IMAGE}}" alt="{{TITLE}}" />
      <div class="post-meta">
        <span class="date">{{DATE}}</span>
        <span class="read-time">{{READ_TIME}} min read</span>
        <span class="tags">{{TAGS}}</span>
      </div>
      <h1>{{TITLE}}</h1>
      <p class="post-subtitle">{{DESCRIPTION}}</p>
    </div>
    <div class="post-content">
      {{CONTENT}}
    </div>
    <footer class="post-cta">
      <h3>What this means for small businesses</h3>
      <p>{{CTA_COPY}}</p>
      <a class="cta-button" href="https://themushroom.agency">Book a free call</a>
    </footer>
  </article>
</body>
</html>
