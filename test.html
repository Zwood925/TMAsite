<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Test - The Mushroom Agency</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-item { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>File Accessibility Test</h1>
    <p>This page tests if your CSS and JS files are accessible on the deployed site.</p>
    
    <div id="results">
        <div class="test-item">Testing files...</div>
    </div>

    <script>
        const files = [
            'styles.css',
            'script.js',
            'blog-styles.css',
            'blog-script.js',
            'ChatGPTImageJul24202508_27_40PM.png',
            'glowing_shroom.mp4'
        ];

        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        files.forEach(file => {
            fetch(file)
                .then(response => {
                    const div = document.createElement('div');
                    div.className = `test-item ${response.ok ? 'success' : 'error'}`;
                    div.textContent = `${file}: ${response.ok ? '✅ Accessible' : '❌ Not Found (Status: ' + response.status + ')'}`;
                    resultsDiv.appendChild(div);
                })
                .catch(error => {
                    const div = document.createElement('div');
                    div.className = 'test-item error';
                    div.textContent = `${file}: ❌ Error - ${error.message}`;
                    resultsDiv.appendChild(div);
                });
        });
    </script>
</body>
</html>
