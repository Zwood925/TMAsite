<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post — The Mushroom Agency</title>
    <link rel="icon" type="image/png" href="ChatGPTImageJul24202508_27_40PM.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="blog-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-mushroom"></i>
                <span>The Mushroom Agency</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#what-we-do">What We Do</a></li>
                <li><a href="index.html#ai-for-everyone">AI for Everyone</a></li>
                <li><a href="index.html#journey">Start Your Journey</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="index.html#contact" class="cta-button">Let's Talk</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <article class="post" id="post-content">
            <!-- Post content will be loaded here -->
        </article>

        <!-- Post CTA -->
        <section class="post-cta">
            <div class="container">
                <h2>Ready to automate your business?</h2>
                <p>Let's build something amazing together.</p>
                <a href="index.html#contact" class="cta-button">Let's Talk</a>
            </div>
        </section>
    </main>

    <script>
        let currentPost = null;

        // Get post ID from URL
        function getPostId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // Load post from JSON file
        async function loadPost() {
            const postId = getPostId();
            if (!postId) {
                showError('Post not found');
                return;
            }

            try {
                const response = await fetch('posts.json');
                const data = await response.json();
                const post = data.posts.find(p => p.id === postId && p.published);
                
                if (!post) {
                    showError('Post not found');
                    return;
                }

                currentPost = post;
                displayPost(post);
                updatePageTitle(post.title);
            } catch (error) {
                console.error('Error loading post:', error);
                showError('Error loading post');
            }
        }

        function displayPost(post) {
            const postContent = document.getElementById('post-content');
            
            postContent.innerHTML = `
                <div class="post-hero">
                    <img src="${post.coverImage || 'ChatGPTImageJul24202508_27_40PM.png'}" alt="${post.title}" />
                    <div class="post-meta">
                        <span class="category">${post.category.charAt(0).toUpperCase() + post.category.slice(1)}</span>
                        <span class="date">${post.date}</span>
                        <span class="read-time">${post.readTime}</span>
                    </div>
                    <h1>${post.title}</h1>
                    ${post.subtitle ? `<p class="post-subtitle">${post.subtitle}</p>` : ''}
                </div>
                
                <div class="post-content">
                    ${post.content}
                </div>
                
                <div class="post-footer">
                    <div class="post-tags">
                        ${post.tags ? post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : ''}
                    </div>
                    
                    <div class="share-section">
                        <h3>Share this post</h3>
                        <div class="share-buttons">
                            <button class="share-btn" onclick="sharePost('${post.title}', '${window.location.href}', 'twitter')">
                                <i class="fab fa-twitter"></i> Twitter
                            </button>
                            <button class="share-btn" onclick="sharePost('${post.title}', '${window.location.href}', 'linkedin')">
                                <i class="fab fa-linkedin"></i> LinkedIn
                            </button>
                            <button class="share-btn" onclick="copyLink('${window.location.href}')">
                                <i class="fas fa-link"></i> Copy Link
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updatePageTitle(title) {
            document.title = `${title} — The Mushroom Agency`;
        }

        function showError(message) {
            const postContent = document.getElementById('post-content');
            postContent.innerHTML = `
                <div class="error-message">
                    <h1>${message}</h1>
                    <p>The post you're looking for doesn't exist or has been removed.</p>
                    <a href="blog.html" class="btn">Back to Blog</a>
                </div>
            `;
        }

        function sharePost(title, url, platform) {
            let shareUrl;
            if (platform === 'twitter') {
                shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
            } else if (platform === 'linkedin') {
                shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`;
            }
            
            if (shareUrl) {
                window.open(shareUrl, '_blank');
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                // Show a temporary success message
                const btn = event.target.closest('.share-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadPost();
        });
    </script>

    <style>
        .error-message {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .error-message h1 {
            color: var(--primary-purple);
            margin-bottom: 1rem;
        }
        
        .error-message p {
            color: var(--gray-600);
            margin-bottom: 2rem;
        }
        
        .post-subtitle {
            font-size: 1.2rem;
            color: var(--gray-600);
            font-style: italic;
            margin-top: 1rem;
        }
        
        .post-tags {
            margin-bottom: 2rem;
        }
        
        .tag {
            display: inline-block;
            background: var(--gray-100);
            color: var(--gray-700);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .share-section {
            border-top: 1px solid var(--gray-200);
            padding-top: 2rem;
            margin-top: 2rem;
        }
        
        .share-section h3 {
            margin-bottom: 1rem;
            color: var(--black);
        }
        
        .share-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .share-btn {
            background: var(--gray-100);
            color: var(--gray-700);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }
        
        .share-btn:hover {
            background: var(--primary-purple);
            color: white;
            transform: translateY(-2px);
        }
    </style>
</body>
</html>
